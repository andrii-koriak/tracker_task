<h2 class="text-2xl font-bold mb-4">Вхід</h2>

<form method="post" class="mb-4">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded">
    Увійти
  </button>
</form>

<p class="text-gray-300">
  Немає акаунту?
  <a href="{% url 'register' %}" class="text-indigo-500 hover:underline">Зареєструватися</a>
</p>
