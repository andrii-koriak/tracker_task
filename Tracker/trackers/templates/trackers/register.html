<h2 class="text-2xl font-bold mb-4">Реєстрація</h2>

<form method="post" class="mb-4">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded">
    Зареєструватися
  </button>
</form>

<p class="text-gray-300">
  Вже є акаунт?
  <a href="{% url 'login' %}" class="text-indigo-500 hover:underline">Увійти</a>
</p>
